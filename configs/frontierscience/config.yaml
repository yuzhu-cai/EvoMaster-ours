# Configuration for FrontierScience playground.

llm:
  openai:
    provider: "openai"
    model: "${GPT_CHAT_MODEL}"
    api_key: "${OPENAI_API_KEY}"
    base_url: "${GPT_BASE_URL}"
    temperature: 0.2
    max_tokens: 128000
    timeout: 12000
    max_retries: 10
    retry_delay: 2.0

  local_sglang:
    provider: "deepseek"
    model: "DeepSeek/DeepSeek-V3-0324"
    api_key: "${DEEPSEEK_API_KEY}"  # 本地部署可使用占位符
    base_url: "${DEEPSEEK_API_BASE}"
    temperature: 0.7
    max_tokens: 16384
    timeout: 300  
    max_retries: 3
    retry_delay: 1.0

agents:
  draft:
    llm: "openai"
    max_turns: 80
    tools:
      builtin: ["*"]
    context:
      max_tokens: 128000
      truncation_strategy: "summary"
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: "prompts/draft/system_prompt.txt"
    user_prompt_file: "prompts/draft/user_prompt.txt"

  improve:
    llm: "openai"
    max_turns: 80
    tools:
      builtin: ["*"]
    context:
      max_tokens: 128000
      truncation_strategy: "summary"
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: "prompts/improve/system_prompt.txt"
    user_prompt_file: "prompts/improve/user_prompt.txt"

  metric:
    llm: "openai"
    max_turns: 8
    tools:
      builtin: []
    context:
      max_tokens: 64000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 2
    system_prompt_file: "prompts/metric/system_prompt.txt"
    user_prompt_file: "prompts/metric/user_prompt.txt"

session:
  type: "local"

  local:
    working_dir: "./playground/frontierscience/workspace"
    timeout: 120
    parallel:
      enabled: true
      max_parallel: 1
      split_workspace_for_exp: true

llm_output:
  show_in_console: true
  log_to_file: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_path: "./logs/evomaster.log"

frontierscience:
  mcts:
    num_drafts: 3
    max_total_nodes: 10
    max_depth: 10
    max_children_per_node: 2
    exploration_weight: 1.414
    allow_repeat_improve: false
    use_light_eval_for_intermediate: true
    use_full_eval_for_final: true

  metric:
    weights:
      overall:
        final_answer: 0.7
        trajectory: 0.3
      final_answer:
        task_completion: 1.2
        factual_correctness: 1.3
        evidence_grounding: 1.2
        completeness: 1.0
        scientific_reasonableness: 1.0
        clarity: 0.8
      trajectory:
        retrieval_quality: 1.0
        evidence_usage: 1.2
        reasoning_consistency: 1.0
        revision_effectiveness: 0.9
        exploration_efficiency: 0.9
      penalties:
        missing_evidence: 0.08
        repeated_loop: 0.06
        no_improvement: 0.05
        empty_answer: 0.4
