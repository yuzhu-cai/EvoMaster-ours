# EvoMaster Feishu Bot 配置
# 使用方式: python -m evomaster.interface.feishu --config configs/feishu/config.yaml

# ============================================
# 飞书 Bot 配置
# ============================================
feishu:
  # 飞书应用凭证（从 .env 读取）
  app_id: "cli_a911740602b89cb0"
  app_secret: "22c1FEux4FIA1O2dPk3vybMmAe6N2qQY"

  # API 域名（飞书: https://open.feishu.cn, Lark: https://open.larksuite.com）
  domain: "https://open.feishu.cn"

  # 连接模式: websocket（推荐）或 webhook
  connection_mode: "websocket"

  # 默认 playground agent 名称
  default_agent: "magiclaw"

  # 默认配置文件路径（相对于 project_root，不设置则使用 configs/{agent}/config.yaml）
  default_config_path: "configs/magiclaw/config_test.yaml"

  # 最大并发任务数
  max_concurrent_tasks: 4

  # 单个任务超时时间（秒）
  task_timeout: 600

  # 允许使用 Bot 的用户 open_id 列表（空列表 = 允许所有人）
  allow_from: []

  # 最大并发会话数
  max_sessions: 100

  # 可用子智能体白名单（/list 命令展示）
  # 格式: agent名称: 描述
  available_agents:
    agent_builder: "创建/设计/构建新的 AI Agent"
    web_search_agent: "深度网络搜索与信息综合"
    coding_agent: "代码编写、调试与执行"
    report_writer_agent: "专业报告撰写"

  # Docker 容器池配置（可选，启用后每个用户 session 分配独立容器）
  container_pool:
    enabled: true
    image: "evomaster/base:latest"
    initial_size: 3
    max_size: 10
    memory_limit: "8g"
    cpu_limit: 4.0
    network_mode: "host"
    container_name_prefix: "evopool_test"

  # 定时任务调度器配置
  scheduler:
    enabled: true
    db_path: "data/scheduler/schedules.db"
    max_jobs_per_chat: 10
    max_jobs_total: 20
    max_concurrent_runs: 2
    default_timezone: "Asia/Shanghai"
    max_poll_interval: 60.0
    max_retries: 3