# ============================================
# LLM Configuration
# ============================================
llm:
  openai:
    provider: "openai"
    model: "${GPT_CHAT_MODEL}"
    api_key: "${OPENAI_API_KEY}"
    base_url: "${GPT_BASE_URL}"
    temperature: 0.7
    max_tokens: 16384
    timeout: 60
    max_retries: 3
    retry_delay: 1.0

  deepseek:
    provider: "deepseek"
    model: "deepseek-v4-pro"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com"
    temperature: 0.7
    max_tokens: 16384
    timeout: 60
    max_retries: 3
    retry_delay: 1.0

  default: "deepseek"

# ============================================
# Agent Configuration
# ============================================
agents:
  planner:
    llm: "deepseek"
    max_turns: 1
    finish_on_text_response: true
    tools:
      builtin: []
    context:
      max_tokens: 32000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 3
    system_prompt_file: "prompts/planner_prefix.txt"
    user_prompt_file: "prompts/planner_user.txt"

  executor:
    llm: "deepseek"
    max_turns: 12
    finish_on_text_response: true
    tools:
      builtin: ["think", "finish"]
      search: "google_search"
      fetch: "web_fetch"
    context:
      max_tokens: 64000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 6
    system_prompt_file: "prompts/executor_prefix.txt"
    user_prompt_file: "prompts/executor_user.txt"

  verifier:
    llm: "deepseek"
    max_turns: 6
    finish_on_text_response: true
    tools:
      builtin: ["think"]
    context:
      max_tokens: 32000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 3
    system_prompt_file: "prompts/verifier_prefix.txt"
    user_prompt_file: "prompts/verifier_user.txt"

# ============================================
# Session Configuration
# ============================================
session:
  type: "local"
  local:
    working_dir: "./playground/verify_master/workspace"
    timeout: 60
    gpu_devices: null
    cpu_devices: null
    symlinks: {}

# ============================================
# LLM Output Display Configuration
# ============================================
llm_output:
  show_in_console: true
  log_to_file: true

# ============================================
# Logging Configuration
# ============================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
  console: true
