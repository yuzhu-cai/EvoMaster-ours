paperbench_codedev:
  paperbench_root: /data/yuzhu/Devs/third_party/frontier-evals/project/paperbench
  workspace: /workspace
  paper_mount: /home/paper
  submission_dir: /home/submission
  submission_tar_path: /workspace/artifacts/submission.tar.gz
  host_agent_env: /data/yuzhu/Devs/EvoMaster-ours/.env
  expose_rubric: false
  bootstrap:
    enabled: true
    template: auto
    templates_dir: playground/paperbench_codedev_agent/bootstrap_templates
    overwrite_existing: false
    commit: true
  paper_excerpt_chars: 18000
  addendum_excerpt_chars: 9000
  max_runtime_seconds: 86400
  grade_command: ''
  grade_timeout: 7200
  iteration:
    enabled: true
    max_rounds: 16
    min_rounds: 3
    max_stagnant_rounds: 3
    snapshot_each_round: true
    prompt_file: prompts/iteration_prompt.txt
    grade_each_round: false
llm:
  openai:
    provider: openai
    model: ${GPT_CHAT_MODEL}
    api_key: ${OPENAI_API_KEY}
    base_url: ${GPT_BASE_URL}
    temperature: 0.3
    max_tokens: 8192
    max_tokens_param: max_completion_tokens
    reasoning_effort: medium
    timeout: 300
    max_retries: 8
    retry_delay: 5.0
  default: openai
agents:
  codedev:
    llm: openai
    max_turns: 160
    tools:
      builtin:
      - execute_bash
      - str_replace_editor
      - think
      - finish
      google_search: google_search
      web_fetch: web_fetch
      paperbench_status: paperbench_status
      paperbench_paper: paperbench_paper
    context:
      max_tokens: 80000
      truncation_strategy: summary
      preserve_system_messages: true
      preserve_recent_turns: 6
    system_prompt_file: prompts/system_prompt.txt
    user_prompt_file: prompts/user_prompt.txt
    prompt_format_kwargs: {}
session:
  type: docker
  local:
    working_dir: ./playground/paperbench_codedev_agent/workspace
    timeout: 86400
    gpu_devices: null
    cpu_devices: 0-15
    symlinks: {}
  docker:
    image: pb-env:latest
    pull_image: never
    container_name: null
    use_existing_container: null
    working_dir: /workspace
    workspace_path: /workspace
    gpu_devices: null
    one_gpu_per_container: false
    memory_limit: 32g
    cpu_limit: 8.0
    cpu_devices: null
    network_mode: host
    volumes: {}
    env_vars:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GPT_BASE_URL: ${GPT_BASE_URL}
      GPT_CHAT_MODEL: ${GPT_CHAT_MODEL}
      SERPER_KEY_ID: ${SERPER_KEY_ID}
      JINA_API_KEY: ${JINA_API_KEY}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface/hub
      TRANSFORMERS_CACHE: /root/.cache/huggingface/hub
      TORCH_HOME: /root/.cache/torch
      NO_PROXY: localhost,127.0.0.1
    auto_remove: true
    timeout: 86400
llm_output:
  show_in_console: false
  log_to_file: true
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: null
  console: true
