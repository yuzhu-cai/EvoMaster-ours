# EmboMaster 专用映射配置
# 目标：对齐 place_phone_stand 任务的 EmbodiedBench 端到端运行参数。
#
# 使用方式：
# python run.py --agent embomaster \
#   --config configs/embomaster/config_robotwin_place_phone_stand_dsv32_e2e_10s.yaml \
#   --task /data/zixing/code/EvoMaster-ours/playground/embomaster/PRDs/robotwin_place_phone_stand_RDT.md

llm:
  gpugeek_vendor2_claude46:
    provider: "openai"
    model: "Vendor2/Claude-4.6-Opus"
    api_key: "u0rgjezq53e5tv01000dg95v0yqn2eecv02b7z3r"
    base_url: "https://api.gpugeek.com/v1"
    temperature: 0.5
    max_tokens: 16384
    timeout: 300
    max_retries: 3
    retry_delay: 1.0
  default: "gpugeek_vendor2_claude46"

agents:
  coding:
    llm: "gpugeek_vendor2_claude46"
    max_turns: 100
    enable_tools: true
    tools:
      builtin:
        - "finish"
        - "str_replace_editor"
        - "debug_test"
        - "video-descriptor"
        - "xmaster_search_web_search"
        - "xmaster_search_web_parse"
      mcp: "mcp_x_master_search.json"
    context:
      max_tokens: 128000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 6
    system_prompt_file: "prompts/coding_system_prompt.txt"
    user_prompt_file: "prompts/coding_user_prompt.txt"

  feedback:
    llm: "gpugeek_vendor2_claude46"
    max_turns: 8
    enable_tools: true
    tools:
      builtin:
        - "execute_bash"
        - "str_replace_editor"
        - "think"
        - "finish"
        - "video-descriptor"
    context:
      max_tokens: 64000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 4
    system_prompt_file: "prompts/feedback_system_prompt.txt"
    user_prompt_file: "prompts/feedback_user_prompt.txt"

session:
  type: "local"
  local:
    working_dir: "./playground/embomaster/workspaces"
    timeout: 300
    symlinks:
      "/data/zixing/code/simulators/RoboTwin": "codebase"
      "/data/zixing/code/simulators/RoboTwin/data": "input"

debug_test:
  enabled: true
  default_timeout: 600
  default_env_init: ""
  use_k8s_debug_pod: true
  k8s_fallback_to_local: false

video_descriptor:
  enabled: true
  base_url: "127.0.0.1:30030"
  api_key: ""
  model: "Qwen/Qwen3-VL-235B-A22B-Instruct"
  temperature: 0.2
  max_tokens: 1024
  timeout: 120
  max_frames: 12

tool_policy:
  allowed:
    - "finish"
    - "str_replace_editor"
    - "debug_test"
    - "video-descriptor"
    - "xmaster_search_web_search"
    - "xmaster_search_web_parse"
  disable_execute_bash: true

experiment:
  # 与 adjust_bottle e2e_10s 模板保持一致
  steps: 10
  time_limit_seconds: 86400
  metric_mode: "maximize"
  metric_pattern: "success\\s*rate\\s*[:=]\\s*([0-9]*\\.?[0-9]+)"
  stop_on_job_failed: false

workspace_isolation:
  enabled: true
  session_dir: ".embomaster_session"
  source_codebase_dir: "/data/zixing/code/simulators/RoboTwin"
  parent_strategy: "advisor"
  size_threshold_mb: 30
  copy_plan_cache_enabled: true
  copy_plan_cache_file: ".embomaster_copy_plan.json"
  copy_plan_rebuild: false
  submission_subdir: "submission"

parent_selection:
  enabled: true
  allow_none: true
  fallback_strategy: "best"
  require_valid_eval_for_last: true
  require_metric_for_last: true
  reject_last_on_k8s_status:
    - "failed"
    - "timeout"
  max_feedback_chars: 1200
  recent_rounds: 3

result_validation:
  enabled: true
  require_eval_dir: true
  require_success_rate_txt: true
  require_checkpoint: true
  require_dataset_stats: true
  invalidate_metric_on_failure: true
  invalid_k8s_status: "invalid_artifacts"

k8s_runner:
  enabled: true
  namespace: "robotwin"
  poll_interval_seconds: 15
  job_timeout_seconds: 18000
  cleanup_on_success: true
  cleanup_on_timeout: true
  manifest_path: "configs/embomaster/k8s_template/robotwin-rdt-place-phone-stand.yaml"
  job_name_prefix: "robotwin-rdt-place-phone-stand"
  container_workspace: "/workspace"
  container_name: "robotwin-train"
  apply_mounts_to_all_containers: false
  codebase_volume_name: "robowin-workspace"
  codebase_mount_path: "/workspace/RoboTwin"
  enable_assets_alias_mount: true
  assets_subdir: "assets"
  assets_alias_mount_path: "/workspace/assets"
  assets_alias_volume_name: "robowin-assets-alias"
  enable_submission_mount: true
  submission_volume_name: "submission"
  submission_mount_path: "/workspace/submission"
  enable_large_dir_mounts: true
  large_dir_volume_prefix: "large-dir"
  manifest_env:
    TASK_NAME: "place_phone_stand"
    TASK_CONFIG: "demo_clean"
    EXPERT_DATA_NUM: "1000"
    SEED: "0"
    GPU_ID: "0"
    ACTION_DIM: "14"
    TRAIN_TIMEOUT: "14400"
    HEAD_CAMERA_TYPE: "D435"
  debug_pod:
    enabled: true
    image: "10.1.0.116:5000/robotwin:RDT_v0.1"
    pod_name_prefix: "robotwin-debug"
    container_name: "debug"
    pin_to_local_node: false
    node_name: ""
    workspace_mount_path: "/workspace"
    workspace_host_path_type: "Directory"
    command: ["sleep", "infinity"]
    ready_timeout_seconds: 120
    cleanup_after_exec: false

mcp:
  enabled: true
  config_file: "mcp_x_master_search.json"

llm_output:
  show_in_console: true
  log_to_file: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
  console: true
  log_path: "./logs/embomaster_robotwin_place_phone_stand_dsv32.log"

project_root: "."
run_dir_base: "./playground/embomaster/workspaces"
workspace: "./playground/embomaster/workspaces"
results_dir: "./results"
debug: false

env:
  cluster:
    debug_pool:
      type: "cpu"
      max_concurrent: 1
    train_pool:
      type: "cpu"
      max_concurrent: 1
  docker:
    base_image: "python:3.11-slim"
    registry: "docker.io"
    pull_policy: "if_not_present"
  scheduler:
    type: "local"
    queue_timeout: 300
    retry_failed: false
    max_retries: 1
