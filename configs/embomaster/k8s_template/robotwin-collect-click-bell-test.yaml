# RoboTwin 数据采集 K8S Job - click_bell 任务 (测试 GPU 0)
apiVersion: batch/v1
kind: Job
metadata:
  name: robotwin-collect-click-bell-1000-v2
  namespace: robotwin
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: robotwin-collect
        image: 10.1.0.116:5000/robotwin:v1.2
        imagePullPolicy: IfNotPresent
        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,graphics"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TASK_NAME
          value: "click_bell"
        - name: TASK_CONFIG
          value: "demo_clean_1000"
        - name: GPU_ID
          value: "0"
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "64Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "32Gi"
        volumeMounts:
        - name: robotwin-workspace
          mountPath: /workspace/RoboTwin
        - name: dshm
          mountPath: /dev/shm
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -e
          source /opt/conda/etc/profile.d/conda.sh
          conda activate RoboTwin
          cd /workspace/RoboTwin
          bash collect_data.sh "${TASK_NAME}" "${TASK_CONFIG}" "${GPU_ID}"
      volumes:
      - name: robotwin-workspace
        hostPath:
          path: /data/yuanshuozhang/RoboTwin
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi

