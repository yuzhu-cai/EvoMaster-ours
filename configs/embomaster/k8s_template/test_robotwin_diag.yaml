apiVersion: batch/v1
kind: Job
metadata:
  name: robotwin-test-diag
  namespace: embo-ml-master-robotwin
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: robotwin-train
        image: 10.254.40.242:30550/robotwin:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,graphics"
        - name: TASK_NAME
          value: "adjust_bottle"
        - name: TASK_CONFIG
          value: "demo_clean"
        - name: EXPERT_DATA_NUM
          value: "5"
        - name: SEED
          value: "0"
        - name: GPU_ID
          value: "0"
        - name: ACTION_DIM
          value: "14"
        - name: TRAIN_TIMEOUT
          value: "300"
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "40Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: "20Gi"
        volumeMounts:
        - name: robowin-workspace
          mountPath: /workspace/RoboTwin
        - name: dshm
          mountPath: /dev/shm
        - name: submission
          mountPath: /workspace/submission
        command: ["/bin/bash", "-lc"]
        args:
        - >
          cd /workspace/RoboTwin/policy/DP &&
          bash train_and_eval_ml-master-2.sh
          "/workspace/RoboTwin"
          "test-node"
          "/workspace/submission"
          "${TASK_NAME}"
          "${TASK_CONFIG}"
          "${EXPERT_DATA_NUM}"
          "${SEED}"
          "${GPU_ID}"
          "${ACTION_DIM}"
          "${TRAIN_TIMEOUT}"
      volumes:
      - name: robowin-workspace
        hostPath:
          path: /data/yuanshuozhang/RoboTwin
          type: Directory
      - name: submission
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi

