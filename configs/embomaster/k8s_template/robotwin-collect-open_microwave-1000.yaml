# RoboTwin 数据采集 K8S Job - open_microwave 任务 (1000 条数据)
# 用法: kubectl apply -f robotwin-collect-open_microwave-1000.yaml
# 预计运行时间: 约 4-8 小时（取决于硬件性能）
# 参考: https://robotwin-platform.github.io/doc/usage/collect-data.html
apiVersion: batch/v1
kind: Job
metadata:
  name: robotwin-collect-open-microwave-1000
  namespace: robotwin
spec:
  backoffLimit: 0
  # 1000 条数据采集可能需要较长时间，设置 48 小时超时
  activeDeadlineSeconds: 172800  # 48 小时
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: robotwin-collect
        # 使用与训练相同的镜像
        image: 10.1.0.116:5000/robotwin:v1.2
        imagePullPolicy: IfNotPresent

        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,graphics"
        # 数据采集任务参数
        - name: TASK_NAME
          value: "open_microwave"
        - name: TASK_CONFIG
          value: "demo_clean_1000"
        - name: GPU_ID
          value: "0"

        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "64Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "32Gi"

        volumeMounts:
        - name: robotwin-workspace
          mountPath: /workspace/RoboTwin
        - name: dshm
          mountPath: /dev/shm

        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -e
          echo "=============================================="
          echo "[K8S] RoboTwin Data Collection Job"
          echo "[K8S] Task: open_microwave (1000 episodes)"
          echo "=============================================="
          echo "TASK_NAME:   ${TASK_NAME}"
          echo "TASK_CONFIG: ${TASK_CONFIG}"
          echo "GPU_ID:      ${GPU_ID}"
          echo "=============================================="
          
          # 激活 conda 环境
          echo "[K8S] Activating conda environment..."
          source /opt/conda/etc/profile.d/conda.sh
          conda activate RoboTwin
          
          # 进入 RoboTwin 目录
          cd /workspace/RoboTwin
          echo "[K8S] Working directory: $(pwd)"
          
          # 检查任务环境文件是否存在
          if [ ! -f "envs/${TASK_NAME}.py" ]; then
              echo "[ERROR] Task ${TASK_NAME} not found in envs/"
              exit 1
          fi
          
          # 检查配置文件是否存在
          if [ ! -f "task_config/${TASK_CONFIG}.yml" ]; then
              echo "[ERROR] Config ${TASK_CONFIG}.yml not found in task_config/"
              exit 1
          fi
          
          # 显示配置信息
          echo ""
          echo "[K8S] Configuration:"
          grep "episode_num" "task_config/${TASK_CONFIG}.yml"
          echo ""
          
          # 记录开始时间
          START_TIME=$(date +%s)
          echo "[K8S] Starting data collection at $(date)"
          echo ""
          
          # 运行数据采集
          echo "[K8S] Command: bash collect_data.sh ${TASK_NAME} ${TASK_CONFIG} ${GPU_ID}"
          echo ""
          
          bash collect_data.sh "${TASK_NAME}" "${TASK_CONFIG}" "${GPU_ID}"
          
          # 记录结束时间
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          HOURS=$((DURATION / 3600))
          MINUTES=$(((DURATION % 3600) / 60))
          
          echo ""
          echo "[K8S] Data collection completed!"
          echo "[K8S] Total time: ${HOURS}h ${MINUTES}m"
          echo "[K8S] Data saved to: /workspace/RoboTwin/data/${TASK_NAME}/${TASK_CONFIG}/"
          
          # 显示采集结果
          echo ""
          echo "[K8S] Collected data summary:"
          ls -la "/workspace/RoboTwin/data/${TASK_NAME}/${TASK_CONFIG}/data/" 2>/dev/null | head -30 || echo "No data files found"
          
          # 统计 episode 数量
          EPISODE_COUNT=$(ls -1 "/workspace/RoboTwin/data/${TASK_NAME}/${TASK_CONFIG}/data/"*.hdf5 2>/dev/null | wc -l)
          echo ""
          echo "=============================================="
          echo "[K8S] Total episodes collected: ${EPISODE_COUNT} / 1000"
          echo "=============================================="
          
          # 验证数据完整性
          if [ "$EPISODE_COUNT" -lt 1000 ]; then
              echo "[WARNING] Expected 1000 episodes but only collected ${EPISODE_COUNT}"
              echo "[WARNING] Some episodes may have failed during collection"
          else
              echo "[SUCCESS] All 1000 episodes collected successfully!"
          fi

      volumes:
      - name: robotwin-workspace
        hostPath:
          path: /data/yuanshuozhang/RoboTwin
          type: Directory

      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi


