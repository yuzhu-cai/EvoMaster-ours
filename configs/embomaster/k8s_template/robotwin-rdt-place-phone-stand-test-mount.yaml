apiVersion: batch/v1
kind: Job
metadata:
  name: robotwin-rdt-place-phone-stand-test-mount
  namespace: robotwin
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: robotwin-train
        image: 10.254.40.242:30550/robotwin:RDT_v0.1
        imagePullPolicy: IfNotPresent

        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,graphics"
        # PyTorch 显存管理优化，减少内存碎片
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        resources:
          limits:
            nvidia.com/gpu: 8
            cpu: "32"
            memory: "320Gi"
          requests:
            nvidia.com/gpu: 8
            cpu: "32"
            memory: "320Gi"

        volumeMounts:
        - name: robowin-workspace
          mountPath: /workspace/RoboTwin
        - name: dshm
          mountPath: /dev/shm
        - name: submission
          mountPath: /workspace/submission
        - name: policy-weights
          mountPath: /workspace/RoboTwin/policy/weights

        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -e
          source /opt/conda/etc/profile.d/conda.sh
          conda activate RoboTwin
          echo "[TEST] Container started, sleeping for 1 hour to allow inspection..."
          echo "[TEST] Mount points:"
          echo "  - /workspace/RoboTwin -> robowin-workspace"
          echo "  - /workspace/RoboTwin/policy/weights -> policy-weights"
          echo "  - /workspace/submission -> submission"
          echo "  - /dev/shm -> dshm"
          echo "[TEST] Checking mounts..."
          ls -la /workspace/RoboTwin/policy/weights || echo "Warning: /workspace/RoboTwin/policy/weights not accessible"
          sleep 3600


      volumes:
      - name: robowin-workspace
        hostPath:
          path: /data/yuanshuozhang/RoboTwin
          type: Directory

      - name: submission
        emptyDir: {}

      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi

      - name: policy-weights
        hostPath:
          path: /data/agents/openhands-ml-master/embodied-benchmarks-code-repos/robotwin/policy/weights
          type: Directory
