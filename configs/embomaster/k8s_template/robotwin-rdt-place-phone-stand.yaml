apiVersion: batch/v1
kind: Job
metadata:
  name: robotwin-rdt-place-phone-stand
  namespace: robotwin
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: robotwin-train
        image: 10.254.40.242:30550/robotwin:RDT_v0.1
        imagePullPolicy: IfNotPresent

        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,graphics"
        # PyTorch 显存管理优化，减少内存碎片
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        - name: TASK_NAME
          value: "place_phone_stand"
        - name: TASK_CONFIG
          value: "demo_clean"
        - name: EXPERT_DATA_NUM
          value: "1000"
        - name: SEED
          value: "0"
        - name: GPU_ID
          value: "0"
        - name: ACTION_DIM
          value: "14"
        - name: TRAIN_TIMEOUT
          value: "14400"                     # 4 hours for 1000 episodes
        - name: HEAD_CAMERA_TYPE
          value: "D435"
        - name: CHECKPOINT_EVERY
          value: "3"  # Save checkpoint every 3 epochs for 1000 episodes dataset

        resources:
          limits:
            nvidia.com/gpu: 8
            cpu: "32"
            memory: "450Gi"
          requests:
            nvidia.com/gpu: 8
            cpu: "32"
            memory: "450Gi"

        volumeMounts:
        - name: robowin-workspace
          mountPath: /workspace/RoboTwin
        - name: dshm
          mountPath: /dev/shm
        - name: submission
          mountPath: /workspace/submission
        - name: policy-weights
          mountPath: /workspace/RoboTwin/policy/weights

        command: ["/bin/bash", "-lc"]
        args:
        - |
          bash /workspace/RoboTwin/policy/RDT/train_and_eval_rdt_place_phone_stand.sh

      volumes:
      - name: robowin-workspace
        hostPath:
          path: /data/yuanshuozhang/RoboTwin
          type: Directory

      - name: submission
        emptyDir: {}

      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 128Gi

      - name: policy-weights
        hostPath:
          path: /data/modelsrepo/
          type: Directory
