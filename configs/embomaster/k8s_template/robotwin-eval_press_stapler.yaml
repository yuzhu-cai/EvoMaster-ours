apiVersion: batch/v1
kind: Job
metadata:
  name: robotwin-eval-dp-press-stapler
  namespace: robotwin
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: robotwin-eval
        image: 10.254.40.242:30550/robotwin:v1.2
        imagePullPolicy: IfNotPresent

        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,graphics"

        - name: TASK_NAME
          value: "press_stapler"
        - name: TASK_CONFIG
          value: "demo_clean_1000"
        - name: EXPERT_DATA_NUM
          value: "1000"
        - name: SEED
          value: "0"
        - name: GPU_ID
          value: "0"
        - name: HEAD_CAMERA_TYPE
          value: "D435"
        - name: CHECKPOINT_NUM
          value: "30"

        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "40Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "20Gi"

        volumeMounts:
        - name: robowin-workspace
          mountPath: /workspace/RoboTwin
        - name: dshm
          mountPath: /dev/shm

        command: ["/bin/bash", "-lc"]
        args:
        - >
          source /opt/conda/etc/profile.d/conda.sh &&
          conda activate RoboTwin &&
          cd /workspace/RoboTwin/policy/DP &&
          echo "[K8S] Starting evaluation for ${TASK_NAME} with checkpoint ${CHECKPOINT_NUM}..." &&
          bash eval.sh "${TASK_NAME}" "${TASK_CONFIG}" "${TASK_CONFIG}" "${EXPERT_DATA_NUM}" "${SEED}" "${GPU_ID}" "${CHECKPOINT_NUM}"

      volumes:
      - name: robowin-workspace
        hostPath:
          path: /data/yuanshuozhang/RoboTwin
          type: Directory

      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi

