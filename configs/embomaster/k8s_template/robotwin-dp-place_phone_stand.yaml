apiVersion: batch/v1
kind: Job
metadata:
  name: robotwin-train-dp-place-phone-stand
  namespace: robotwin
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: robotwin-train
        image: 10.1.0.116:5000/robotwin:v1.2
        imagePullPolicy: IfNotPresent

        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,graphics"

        - name: TASK_NAME
          value: "place_phone_stand"
        - name: TASK_CONFIG
          value: "demo_clean_1000"
        - name: EXPERT_DATA_NUM
          value: "1000"
        - name: SEED
          value: "0"
        - name: GPU_ID
          value: "0"
        - name: ACTION_DIM
          value: "14"
        - name: TRAIN_TIMEOUT
          value: "14400"
        - name: HEAD_CAMERA_TYPE
          value: "D435"
        - name: CHECKPOINT_EVERY
          value: "30"

        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "80Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "40Gi"

        volumeMounts:
        - name: robowin-workspace
          mountPath: /workspace/RoboTwin
        - name: dshm
          mountPath: /dev/shm
        - name: submission
          mountPath: /workspace/submission

        command: ["/bin/bash", "-lc"]
        args:
        - >
          cd /workspace/RoboTwin/policy/DP &&
          bash train_and_eval_ml-master-2.sh
          "/workspace/RoboTwin"
          "${HOSTNAME:-robotwin-job}"
          "/workspace/submission"
          "${TASK_NAME}"
          "${TASK_CONFIG}"
          "${EXPERT_DATA_NUM}"
          "${SEED}"
          "${GPU_ID}"
          "${ACTION_DIM}"
          "${TRAIN_TIMEOUT}"

      volumes:
      - name: robowin-workspace
        hostPath:
          path: /data/yuanshuozhang/RoboTwin
          type: Directory

      - name: submission
        emptyDir: {}

      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
