apiVersion: batch/v1
kind: Job
metadata:
  name: robotwin-train-dp-put-object-cabinet-test-10
  namespace: robotwin
spec:
  backoffLimit: 0
  # 测试任务，设置 2 小时超时（10 个 episode 应该很快完成）
  activeDeadlineSeconds: 7200  # 2 hours
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: robotwin-train
        image: 10.1.0.116:5000/robotwin:v1.2
        imagePullPolicy: IfNotPresent

        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,graphics"
        # PyTorch 显存管理优化，减少内存碎片
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        - name: TASK_NAME
          value: "put_object_cabinet"
        - name: TASK_CONFIG
          value: "demo_clean_10"  # 使用新生成的小数据集
        - name: EXPERT_DATA_NUM
          value: "10"  # 10 个 episode
        - name: SEED
          value: "0"
        - name: GPU_ID
          value: "0"
        - name: ACTION_DIM
          value: "14"
        - name: TRAIN_TIMEOUT
          value: "3600"  # 1 hour for 10 episodes (should be enough)
        - name: HEAD_CAMERA_TYPE
          value: "D435"
        - name: CHECKPOINT_EVERY
          value: "1"  # Save checkpoint every epoch for small dataset

        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "80Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "40Gi"

        volumeMounts:
        - name: robowin-workspace
          mountPath: /workspace/RoboTwin
        - name: dshm
          mountPath: /dev/shm
        - name: submission
          mountPath: /workspace/submission

        command: ["/bin/bash", "-lc"]
        args:
        - |
          CODEBASE_PATH="/workspace/RoboTwin"
          cd "${CODEBASE_PATH}/policy/DP" && \
          bash train_and_eval_ml-master-put_object_cabinet.sh \
          "${CODEBASE_PATH}" \
          "${HOSTNAME:-robotwin-job-test-10}" \
          "/workspace/submission" \
          "${TASK_NAME}" \
          "${TASK_CONFIG}" \
          "${EXPERT_DATA_NUM}" \
          "${SEED}" \
          "${GPU_ID}" \
          "${ACTION_DIM}" \
          "${TRAIN_TIMEOUT}"


      volumes:
      - name: robowin-workspace
        hostPath:
          path: /data/yuanshuozhang/RoboTwin
          type: Directory

      - name: submission
        emptyDir: {}

      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi




