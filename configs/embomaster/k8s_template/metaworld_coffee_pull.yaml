apiVersion: batch/v1
kind: Job
metadata:
  name: ml-master-metaworld-coffee-pull
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: metaworld-train
        # ★ 这里改成你私有仓库里的镜像 ★
        image: 10.1.0.116:5000/metaworld_single_task_rl:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,graphics"

        - name: TASK_CONFIG
          value: "coffee_pull"             

        - name: TRAIN_TIMEOUT
          value: "3600"     

        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "80Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "40Gi"

        volumeMounts:
          - name: dshm
            mountPath: /dev/shm

        command: ["/bin/bash", "-lc"]
        args:
        - >
          cd /workspace && source /opt/conda/etc/profile.d/conda.sh && conda activate metaworld && 
          bash train.sh --task_config $TASK_CONFIG && bash eval.sh 


      volumes:



      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
