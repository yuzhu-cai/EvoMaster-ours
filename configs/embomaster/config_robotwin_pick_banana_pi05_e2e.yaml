# EmboMaster 专用映射配置
# 目标：对齐 pick_banana Pi0.5 / OpenPI 任务的端到端运行参数。
#
# 使用方式：
# python run.py --agent embomaster \
#   --config configs/embomaster/config_robotwin_pick_banana_pi05_e2e.yaml \
#   --task /data/zixing/code/EvoMaster-ours/playground/embomaster/PRDs/robotwin_pick_banana_Pi05.md
#
# 已验证基线（2026-03-16）：
# - manifest: configs/embomaster/k8s_template/robotwin-pi05-pick_banana-20k_eval.yaml
# - default train steps: 20000
# - default save interval: 2000
# - default train timeout: 32400 seconds (9 hours)
# - default job timeout: 43200 seconds (12 hours)
# - confirmation tag: PB-PI05-FULL-20K-20260317

llm:
  gpugeek_vendor2_claude46:
    provider: "openai"
    model: "Vendor2/Claude-4.6-Opus"
    api_key: "u0rgjezq53e5tv01000dg95v0yqn2eecv02b7z3r"
    base_url: "https://api.gpugeek.com/v1"
    temperature: 0.5
    max_tokens: 16384
    timeout: 300
    max_retries: 5
    retry_delay: 1.0
  default: "gpugeek_vendor2_claude46"

agents:
  coding:
    llm: "gpugeek_vendor2_claude46"
    max_turns: 100
    enable_tools: true
    tools:
      builtin:
        - "finish"
        - "str_replace_editor"
        - "debug_test"
        - "video-descriptor"
        - "xmaster_search_web_search"
        - "xmaster_search_web_parse"
      mcp: "mcp_x_master_search.json"
    context:
      max_tokens: 128000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 6
    system_prompt_file: "prompts/coding_system_prompt.txt"
    user_prompt_file: "prompts/coding_user_prompt.txt"

  feedback:
    llm: "gpugeek_vendor2_claude46"
    max_turns: 8
    enable_tools: true
    tools:
      builtin:
        - "execute_bash"
        - "str_replace_editor"
        - "think"
        - "finish"
        - "video-descriptor"
    context:
      max_tokens: 64000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 4
    system_prompt_file: "prompts/feedback_system_prompt.txt"
    user_prompt_file: "prompts/feedback_user_prompt.txt"

session:
  type: "local"
  local:
    working_dir: "./playground/embomaster/workspaces"
    timeout: 300
    symlinks:
      "/data/zixing/code/simulators/RoboTwin": "codebase"

debug_test:
  enabled: true
  default_timeout: 900
  default_env_init: "source /opt/conda/etc/profile.d/conda.sh && conda activate openpi"
  use_k8s_debug_pod: true
  k8s_fallback_to_local: false

video_descriptor:
  enabled: true
  base_url: "https://api.gpugeek.com/v1"
  api_key: "u0rgjezq53e5tv01000dg95v0yqn2eecv02b7z3r"
  model: "Vendor2/gemini-3-flash"
  input_mode: "auto"
  temperature: 0.2
  max_tokens: 4096
  timeout: 120
  max_frames: 48

tool_policy:
  allowed:
    - "finish"
    - "str_replace_editor"
    - "debug_test"
    - "video-descriptor"
    - "xmaster_search_web_search"
    - "xmaster_search_web_parse"
  disable_execute_bash: true

experiment:
  steps: 200
  time_limit_seconds: 864000
  metric_mode: "maximize"
  metric_pattern: "FINAL_METRIC=([0-9]*\\.?[0-9]+)"
  stop_on_job_failed: false

workspace_isolation:
  enabled: true
  session_dir: ".embomaster_session"
  source_codebase_dir: "/data/zixing/code/simulators/RoboTwin"
  bootstrap_codebase_dir: "/data/zixing/code/EvoMaster-ours/playground/embomaster/workspaces/robotwin/pick_banana/vendor2-claude-4-6-opus/20260323/embomaster_config_robotwin_pick_banana_pi05_e2e_20260323_134016/workspaces/task_0/.embomaster_session/round_workspaces/exp_001-r1-20260323054016571306/codebase_exp_001-r1-20260323054016571306"
  parent_strategy: "advisor"
  size_threshold_mb: 30
  copy_plan_cache_enabled: true
  copy_plan_cache_file: ".embomaster_copy_plan.json"
  copy_plan_rebuild: false
  submission_subdir: "submission"

parent_selection:
  enabled: true
  allow_none: true
  fallback_strategy: "best"
  require_valid_eval_for_last: true
  require_metric_for_last: true
  reject_last_on_k8s_status:
    - "failed"
    - "timeout"
  max_feedback_chars: 1200
  recent_rounds: 3

result_validation:
  enabled: true
  require_eval_dir: true
  require_success_rate_txt: true
  require_checkpoint: false
  require_dataset_stats: false
  invalidate_metric_on_failure: true
  invalid_k8s_status: "invalid_artifacts"

k8s_runner:
  enabled: true
  namespace: "robotwin"
  poll_interval_seconds: 15
  job_timeout_seconds: 43200
  cleanup_on_success: true
  cleanup_on_timeout: true
  manifest_path: "configs/embomaster/k8s_template/robotwin-pi05-pick_banana-20k_eval.yaml"
  job_name_prefix: "robotwin-pick-banana-pi05-20k"
  container_workspace: "/workspace"
  container_name: "robotwin-train"
  apply_mounts_to_all_containers: false
  codebase_volume_name: "robowin-workspace"
  codebase_mount_path: "/workspace/RoboTwin"
  enable_assets_alias_mount: false
  assets_subdir: "assets"
  assets_alias_mount_path: "/workspace/assets"
  assets_alias_volume_name: "robowin-assets-alias"
  enable_submission_mount: true
  submission_volume_name: "submission"
  submission_mount_path: "/workspace/submission"
  enable_large_dir_mounts: true
  large_dir_volume_prefix: "large-dir"
  manifest_env:
    TASK_NAME: "pick_banana"
    TASK_CONFIG: "demo_randomized_franka_openpi"
    TRAIN_CONFIG_NAME: "pi05_pick_banana_full_mixed"
    MODEL_NAME: "pick_banana_full_mixed_embomaster"
    DATA_REPO_ID: "pick_banana_mixed"
    SEED: "0"
    GPU_ID: "0,1,2,3,4,5,6,7"
    NUM_TRAIN_STEPS: "20000"
    SAVE_INTERVAL: "2000"
    LOG_INTERVAL: "10"
    TRAIN_TIMEOUT: "32400"
    XLA_PYTHON_CLIENT_MEM_FRACTION: "0.9"
    HF_LEROBOT_HOME: "/data/yuanshuo/cache/lerobot"
    XDG_CACHE_HOME: "/data/yuanshuo/cache"
    HF_HOME: "/data/yuanshuo/cache/huggingface"
  debug_pod:
    enabled: true
    image: "10.1.0.116:5000/robotwin@sha256:3c90ebd9fdbdef917e02baa92af1cd8dbef069ccbb3d31af0f8be5fb79834aed"
    pod_name_prefix: "robotwin-debug"
    container_name: "debug"
    env:
      PATH: "/opt/conda/envs/RoboTwin/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,graphics"
      GPU_ID: "0,1,2,3,4,5,6,7"
      XLA_PYTHON_CLIENT_MEM_FRACTION: "0.9"
      HF_LEROBOT_HOME: "/data/yuanshuo/cache/lerobot"
      XDG_CACHE_HOME: "/data/yuanshuo/cache"
      HF_HOME: "/data/yuanshuo/cache/huggingface"
    resources:
      limits:
        nvidia.com/gpu: 8
        cpu: "64"
        memory: "640Gi"
      requests:
        nvidia.com/gpu: 8
        cpu: "32"
        memory: "320Gi"
    pin_to_local_node: false
    node_name: ""
    workspace_mount_path: "/workspace"
    workspace_host_path_type: "Directory"
    command: ["sleep", "infinity"]
    ready_timeout_seconds: 120
    cleanup_after_exec: true

mcp:
  enabled: true
  config_file: "mcp_x_master_search.json"

llm_output:
  show_in_console: true
  log_to_file: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
  console: true
  log_path: "./logs/embomaster_robotwin_pick_banana_pi05.log"

project_root: "."
run_dir_base: "./playground/embomaster/workspaces"
workspace: "./playground/embomaster/workspaces"
results_dir: "./results"
debug: false

env:
  cluster:
    debug_pool:
      type: "cpu"
      max_concurrent: 1
    train_pool:
      type: "cpu"
      max_concurrent: 1
  docker:
    base_image: "python:3.11-slim"
    registry: "docker.io"
    pull_policy: "if_not_present"
  scheduler:
    type: "local"
    queue_timeout: 300
    retry_failed: false
    max_retries: 1
