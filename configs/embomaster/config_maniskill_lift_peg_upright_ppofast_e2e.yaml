# EmboMaster config: ManiSkill3 LiftPegUpright-v1 with PPO-Fast.
#
# Pipeline:
#   python run.py --agent embomaster \
#     --config configs/embomaster/config_maniskill_lift_peg_upright_ppofast_e2e.yaml \
#     --task playground/embomaster/PRDs/maniskill/instruction_lift_peg_upright.md

llm:
  gpugeek_vendor2_claude46:
    provider: "openai"
    model: "model_name"
    api_key: "api_key"
    base_url: "base_url"
    temperature: 0.5
    max_tokens: 16384
    timeout: 300
    max_retries: 5
    retry_delay: 1.0
  default: "gpugeek_vendor2_claude46"

llm_precheck:
  enabled: true
  agents:
    - "coding"
    - "feedback"
  prompt: "reply with ok"
  timeout: 20
  max_retries: 1

agents:
  coding:
    llm: "gpugeek_vendor2_claude46"
    max_turns: 100
    enable_tools: true
    tools:
      builtin:
        - "finish"
        - "str_replace_editor"
        - "debug_test"
        - "xmaster_search_web_search"
        - "xmaster_search_web_parse"
      mcp: "mcp_x_master_search.json"
    context:
      max_tokens: 128000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 6
    system_prompt_file: "prompts/coding_system_prompt.txt"
    user_prompt_file: "prompts/coding_user_prompt.txt"

  feedback:
    llm: "gpugeek_vendor2_claude46"
    max_turns: 8
    enable_tools: true
    tools:
      builtin:
        - "execute_bash"
        - "str_replace_editor"
        - "think"
        - "finish"
    context:
      max_tokens: 64000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 4
    system_prompt_file: "prompts/feedback_system_prompt.txt"
    user_prompt_file: "prompts/feedback_user_prompt.txt"

session:
  type: "local"
  local:
    working_dir: "./playground/embomaster/workspaces"
    timeout: 300
    symlinks:
      "/data/gjliu/ManiSkill": "codebase"

debug_test:
  enabled: true
  default_timeout: 900
  default_env_init: ":"
  use_k8s_debug_pod: true
  k8s_fallback_to_local: false

tool_policy:
  allowed:
    - "finish"
    - "str_replace_editor"
    - "debug_test"
    - "xmaster_search_web_search"
    - "xmaster_search_web_parse"
  disable_execute_bash: true

experiment:
  steps: 200
  time_limit_seconds: 864000
  metric_mode: "maximize"
  metric_pattern: "FINAL_METRIC=([0-9]*\\.?[0-9]+)"
  stop_on_job_failed: false

workspace_isolation:
  enabled: true
  session_dir: ".embomaster_session"
  source_codebase_dir: "/data/gjliu/ManiSkill"
  bootstrap_codebase_dir: ""
  parent_strategy: "advisor"
  size_threshold_mb: 30
  copy_plan_cache_enabled: true
  copy_plan_cache_file: ".embomaster_copy_plan_maniskill_lift_peg_upright.json"
  copy_plan_rebuild: false
  submission_subdir: "submission"

parent_selection:
  enabled: true
  allow_none: true
  fallback_strategy: "best"
  require_valid_eval_for_last: false
  require_metric_for_last: true
  reject_last_on_k8s_status:
    - "failed"
    - "timeout"
  max_feedback_chars: 1200
  recent_rounds: 3

result_validation:
  enabled: false

k8s_runner:
  enabled: true
  namespace: "default"
  poll_interval_seconds: 15
  job_timeout_seconds: 10800
  cleanup_on_success: true
  cleanup_on_timeout: true
  manifest_path: "configs/embomaster/k8s_template/maniskill-ppo_fast-train_eval.yaml"
  job_name_prefix: "maniskill-ppofast-lift-peg-upright"
  container_workspace: "/workspace/maniskill"
  container_name: "maniskill-train"
  apply_mounts_to_all_containers: false
  codebase_volume_name: "maniskill-workspace"
  codebase_mount_path: "/workspace/maniskill"
  enable_assets_alias_mount: false
  enable_submission_mount: false
  enable_large_dir_mounts: false
  manifest_env:
    TASK_NAME: "lift_peg_upright"
    TASK_CONFIG: "bb.json"
    EXPERT_DATA_NUM: "50"
    SEED: "0"
    GPU_ID: "0"
    ACTION_DIM: "0"
    TRAIN_TIMEOUT: "7200"
  debug_pod:
    enabled: true
    image: "10.1.0.116:5000/evomaster/maniskill:latest"
    pod_name_prefix: "maniskill-debug-lift-peg-upright"
    container_name: "debug"
    env:
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,graphics"
      GPU_ID: "0"
    resources:
      limits:
        nvidia.com/gpu: 1
        cpu: "4"
        memory: "40Gi"
      requests:
        nvidia.com/gpu: 1
        cpu: "4"
        memory: "20Gi"
    pin_to_local_node: false  # override via node_name below
    node_name: ""
    workspace_mount_path: "/workspace/maniskill"
    workspace_host_path_type: "Directory"
    command: ["sleep", "infinity"]
    ready_timeout_seconds: 120
    cleanup_after_exec: true

mcp:
  enabled: true
  config_file: "mcp_x_master_search.json"

llm_output:
  show_in_console: true
  log_to_file: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
  console: true
  log_path: "./logs/embomaster_maniskill_lift_peg_upright_ppofast.log"

project_root: "."
run_dir_base: "./playground/embomaster/workspaces"
workspace: "./playground/embomaster/workspaces"
results_dir: "./results"
debug: false

env:
  cluster:
    debug_pool:
      type: "cpu"
      max_concurrent: 1
    train_pool:
      type: "cpu"
      max_concurrent: 1
  docker:
    base_image: "python:3.11-slim"
    registry: "docker.io"
    pull_policy: "if_not_present"
  scheduler:
    type: "local"
    queue_timeout: 300
    retry_failed: false
    max_retries: 1
