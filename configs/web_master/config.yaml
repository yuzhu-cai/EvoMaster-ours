# ============================================
# LLM Configuration
# ============================================
llm:
  openai:
    provider: "openai"
    model: "${GPT_CHAT_MODEL}"
    api_key: "${OPENAI_API_KEY}"
    base_url: "${GPT_BASE_URL}"
    temperature: 0.3
    max_tokens: 16384
    timeout: 60
    max_retries: 3
    retry_delay: 1.0

  deepseek:
    provider: "deepseek"
    model: "deepseek-v4-pro"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com"
    temperature: 0.3
    max_tokens: 16384
    timeout: 60
    max_retries: 3
    retry_delay: 1.0

  default: "deepseek"

# ============================================
# Flash-Searcher DAG Experiment Configuration
# ============================================
experiment:
  mode: "flash_searcher_dag"
  max_workers: 3
  max_rounds: 8
  allow_partial_ready: true
  max_dynamic_nodes: 5

# ============================================
# Agent Configuration
# ============================================
agents:
  planner:
    llm: "openai"
    max_turns: 1
    finish_on_text_response: true
    tools:
      builtin: []
    context:
      max_tokens: 32000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 2
    system_prompt_file: "prompts/flash_planner_prefix.txt"
    user_prompt_file: "prompts/flash_planner_user.txt"

  search:
    llm: "openai"
    max_turns: 12
    finish_on_text_response: true
    tools:
      builtin: ["think", "finish", "google_search", "web_fetch"]
    context:
      max_tokens: 80000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 6
    system_prompt_file: "prompts/flash_search_prefix.txt"
    user_prompt_file: "prompts/flash_search_user.txt"

  optimizer:
    llm: "openai"
    max_turns: 1
    finish_on_text_response: true
    tools:
      builtin: []
    context:
      max_tokens: 48000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 2
    system_prompt_file: "prompts/flash_optimizer_prefix.txt"
    user_prompt_file: "prompts/flash_optimizer_user.txt"

  finalizer:
    llm: "openai"
    max_turns: 1
    finish_on_text_response: true
    tools:
      builtin: []
    context:
      max_tokens: 48000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 2
    system_prompt_file: "prompts/flash_finalizer_prefix.txt"
    user_prompt_file: "prompts/flash_finalizer_user.txt"

# ============================================
# Session Configuration
# ============================================
session:
  type: "local"
  local:
    working_dir: "./playground/web_master/workspace"
    timeout: 60
    gpu_devices: null
    cpu_devices: null
    symlinks: {}

# ============================================
# LLM Output Display Configuration
# ============================================
llm_output:
  show_in_console: true
  log_to_file: true

# ============================================
# Logging Configuration
# ============================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
  console: true
